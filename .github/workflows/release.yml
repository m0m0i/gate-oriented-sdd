name: Release Distribution Artifact

on:
  push:
    tags:
      - 'gate-sdd--v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package runtime distribution artifact
        run: python3 scripts/package-release.py dist/gate-sdd.zip

      - name: Verify distribution artifact manifests
        run: |
          mkdir -p /tmp/verify-dist
          unzip -q dist/gate-sdd.zip -d /tmp/verify-dist
          python3 scripts/check-manifests.py /tmp/verify-dist

      - name: Upload artifact for workflow dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: gate-sdd
          path: dist/gate-sdd.zip

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/gate-sdd.zip
