name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Guards, locks, and gate behaviour
    runs-on: ubuntu-latest
    # Named explicitly because one step below reads the tracker. Every other step in this job
    # reads only the working tree, so `contents: read` alone covered it until now.
    permissions:
      contents: read
      issues: read
    steps:
      # Full history: the version-bump guard diffs this branch against the PR base, and
      # a depth-1 checkout has no base to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, and on every PR. This harness was extracted from a private
      # polyrepo, and the cheapest moment to catch private context is before it
      # is merged — not after it is public and in the history.
      - name: Leakage guard
        run: ./scripts/check-leakage.sh

      - name: Both plugin manifests agree
        run: ./scripts/check-manifests.py

      # The no-hand-wrap convention used to exempt fences by delimiter, so the skills that
      # generate this repo's own documents kept emitting the wrapping it had just removed.
      # The language tag is what separates prose from a line-sensitive format mechanically.
      - name: No ```markdown fence hand-wraps the Markdown it quotes
        run: ./scripts/check-markdown-fences.py

      # A rulebook that has drifted from its lock is worse than an unpinned one:
      # the reviewer keeps citing rule ids as though they were the agreed text.
      - name: Rulebooks match their locks
        run: ./assets/check-locks.py

      # The receipt schema lives in three documents at once — the reviewer defines it, the
      # implement skill reproduces it, and this repo's own reviewer mirrors it — and a field
      # added to one and not the others is
      # invisible until a receipt is silently poorer than the schema claims.
      - name: The receipt schema agrees across its copies
        run: ./scripts/check-receipt-schema.py

      # Skills are prose executed by a model, so their load-bearing sentences have
      # dependants and no compiler. This asserts they are present — not that a model
      # follows them, which only an eval can check.
      - name: Skills still carry their load-bearing instructions
        run: ./scripts/check-skill-contracts.py

      # implement's loop defines a task as a complete Red-Green-Refactor cycle; a template
      # that splits red from green asks for a task that cannot be committed without ending
      # the turn red, which the quality gate blocks. The harness would block its own
      # prescribed workflow. Written against the split, so re-separating them fails here on
      # the day the edit is made rather than on the day someone follows it.
      - name: No spec template splits a red step from its green step
        run: ./scripts/check-templates.py

      # A steering line written in a form its reader cannot parse produces nothing and no
      # complaint. This repo lost its own quality anchor that way for a week.
      - name: Steering anchors are readable
        run: ./assets/check-steering-anchors.sh

      # The README's Status section is the repository's claim about itself, and it went stale
      # three ways at once — including a version that survived three releases AND an edit to the
      # same file, because nothing tied it to the manifest bump.
      - name: The README's Status claims agree with their sources
        run: ./scripts/check-readme-claims.py

      # One fact — where the reviewer contract lives — was written in five places and nothing
      # compared them, so it drifted into four forms and survived months of review. It surfaced
      # only when init was run against a real project. A shipped reviewer whose first
      # instruction does not resolve is told by that contract to stop, so the drift ends
      # reviews rather than degrading them.
      - name: Every statement of the contract path agrees
        run: ./scripts/check-contract-path.py

      # The document set is the one validator the turn-end gate structurally cannot cover:
      # quality-gate.sh runs the `- Validators:` line only when a path matching
      # `- Source globs:` changed, and a document is never source — the two sets are disjoint
      # by construction, because one line points at documents and the other at code. So the
      # guard ran on every turn where nothing it checks could have changed, and was absent on
      # the turns where something did. CI is where that window closes.
      - name: Document set matches the declared mode
        run: ./assets/check-document-set.py

      # .steering/tech.md's - Validators: line is the authority on which commands gate a turn;
      # the reviewer's allow-list must cover it, and all 5 reviewers must respect the category rule.
      - name: Reviewer allow-list covers steering validators and respects categories
        run: ./scripts/check-reviewer-allow-list.py

      # The repo's central claim is that the review gate is enforced rather than
      # advisory. That is testable without a model, so it is tested.
      - name: Review gate behaves
        run: ./scripts/test-gates.sh

      # The review gate is a hook, so it can be switched off, and until #26 it asked only about
      # the branch HEAD pointed at — `git checkout main` silenced it and left no trace. This is
      # the same question where neither move is available. PR-only: it reads the event's head
      # branch and head commit, because actions/checkout leaves a pull request on a detached
      # merge ref and a checker reading HEAD would be asking about a commit that exists nowhere
      # else. On a push to main the work has already merged.
      - name: No pull request carries unreviewed work
        if: github.event_name == 'pull_request'
        run: ./assets/check-unreviewed-work.sh "${{ github.event.pull_request.head.ref }}" "${{ github.event.pull_request.head.sha }}"

      # The ordered list restates two facts the tracker also holds — which issues exist for an
      # item, and which are still live — and nothing compared them, so it was false by
      # construction between groomings. This cannot be a turn-end validator: it needs the
      # network and an authenticated `gh`, and a Stop hook that reaches the network is a turn
      # that hangs when the network is down. PR-only, so a merge to main never reddens main on
      # its own; the next pull request is where a row citing newly-closed work is caught.
      - name: The ordered list agrees with the tracker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-backlog-tracker.py

      # A shipped file that changed without a version bump is a fix consumers never
      # receive: `claude plugin update` compares version strings, not commit shas, so it
      # reports success and keeps serving the old content. PR-only, because on a push to
      # main the release decision has already been made.
      - name: Shipped changes carry a version bump
        if: github.event_name == 'pull_request'
        run: ./scripts/check-version-bump.py "${{ github.event.pull_request.base.sha }}"

  # `assets/` is the one shipped path whose files are COPIED into a consumer's tree and then
  # named on that consumer's `- Validators:` line, so their cleanliness is judged by a toolchain
  # this repository never ran: the `guard` job above runs this repository's own guards and no
  # linter on any path. #81 is what that costs — `init` armed a real consumer's gate red on its
  # first turn with `check-locks.py`, and `check-document-set.py` arrived two weeks after the
  # issue was filed carrying the same class. Its own job rather than steps in `guard`, so a red
  # check says "a lint drift" and not "a guard caught a defect". Deliberately not on
  # `.steering/tech.md`'s `- Validators:` line either: neither tool is installed on the
  # developing machine, and a turn-end gate that cannot run locally reports on a toolchain it
  # never found. Both pins are deliberate — an unpinned linter reddens `main` on a day nobody
  # touched the repository. Move them by hand.
  lint:
    name: Assets are clean under a consumer's linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install the pinned linters
        run: python -m pip install ruff==0.16.9 shellcheck-py==0.11.0.1

      # The configuration that reddened #76's consumer — line length 100, `E,F,I,UP,B,SIM,RUF` — a
      # superset of ruff's defaults, so clean here is clean under anything narrower. `--isolated`
      # is load-bearing: a `pyproject.toml` added to this repository later would otherwise be read
      # here and could widen or narrow what this job asserts without anyone editing it, which is
      # configuration reaching into a gate from outside. No `--target-version`: the one
      # version-sensitive finding (`UP017`) was removed rather than suppressed, and the fix was
      # measured clean at py39 and py313 both. Globs rather than the directory: ruff over a
      # directory holding no Python files passes, and a glob that matches nothing is an error.
      - name: Every shipped Python file passes a consumer's ruff check
        run: ruff check --no-cache --isolated --line-length 100 --select E,F,I,UP,B,SIM,RUF --output-format concise assets/*.py

      # `ruff format --check` was the first thing #76's gate ran and the first thing it failed on.
      - name: Every shipped Python file is ruff-formatted
        run: ruff format --no-cache --isolated --line-length 100 --check assets/*.py

      # G-5 says the shipped shell is POSIX `sh`, and until now the claim was read, never run.
      # `-s sh` rather than trusting the shebang, so a bashism is a finding even if a shebang
      # drifts. Only `assets/`: `hooks/gate-lib.sh` carries four deliberate SC2086s — `$_globs`
      # must word-split for `:(glob)` pathspecs, #1 — and is run from here, never copied anywhere.
      - name: Every shipped shell file passes shellcheck as POSIX sh
        run: shellcheck -s sh assets/*.sh

  validate:
    name: Claude Code plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate . --strict
